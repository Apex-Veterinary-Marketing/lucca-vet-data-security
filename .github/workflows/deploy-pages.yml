# Preview deploy: builds the site and publishes dist/ to GitHub Pages at
# https://apex-veterinary-marketing.github.io/lucca-vet-data-security/
# (www.lucca.vet is still the live Webflow site).
#
# The site is served from a subfolder, so the build gets PAGES_BASE (that subfolder:
# astro.config.mjs prefixes every root path with it) and SITE_URL (the github.io
# origin: canonicals and share images point there, and the build is noindexed
# because SITE_URL differs from site.ts's url). Both come from actions/configure-pages.
# At launch on a real domain: drop PAGES_BASE and SITE_URL (and set the custom domain).
#
# Needs Settings → Pages → Source: "GitHub Actions", and a public repo while the
# org is on GitHub Free.
#
# Triggers:
# - push to main: every edit, merge or local push.
# - workflow_run: blog posts from issues. publish-from-issue.yml pushes with
#   GITHUB_TOKEN, and GitHub doesn't start workflows from those pushes, so the
#   deploy hangs off that workflow finishing instead.
# - workflow_dispatch: "Run workflow" in the Actions tab re-publishes on demand.
#
# A failed build never deploys, so the site keeps its last good version.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Publish blog post from issue"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued one waits rather than cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
